.\[clip-path\:polygon\(50\%_0\2c 100\%_100\%\2c 0_100\%\)\] {

:root{
  --bg:#07060d;
  --surface:#12101f;
  --surface2:#1b1830;
  --ink:#fff8ec;
  --muted:#b9b3d0;
  --red:#ff1d2e;
  --teal:#4ecdc4;
  --amber:#ffb52e;
  --blue:#71b7ff;
  --line:rgba(255,255,255,.16);
}
@media (prefers-color-scheme: light){
  :root{
    --bg:#0b0914;
    --surface:#17142a;
    --surface2:#211d3d;
    --ink:#fff8ec;
    --muted:#c9c3de;
  }
}
*{
  box-sizing:border-box
}
html,body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif
}
button{
  font:inherit
}
button:focus-visible,a:focus-visible{
  outline:3px solid var(--amber);
  outline-offset:2px
}
.font-display{
  font-family:Impact,"Arial Black","Trebuchet MS",sans-serif;
  letter-spacing:.04em
}
.font-type{
  font-family:"Courier New",ui-monospace,monospace
}
.logo{
  font-family:Impact,"Arial Black",sans-serif;
  line-height:.78;
  letter-spacing:-.035em;
  text-shadow:0 0 24px rgba(255,29,46,.72),0 6px 0 #2b0307,0 12px 28px rgba(0,0,0,.7)
}
.grain{
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:80;
  opacity:.16;
  mix-blend-mode:overlay;
  background-image:repeating-linear-gradient(0deg,rgba(255,255,255,.22) 0 1px,transparent 1px 3px),repeating-linear-gradient(90deg,rgba(0,0,0,.25) 0 1px,transparent 1px 4px)
}
.vignette{
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:79;
  background:radial-gradient(ellipse at center,transparent 48%,rgba(0,0,0,.68) 100%)
}
.flashlight{
  position:absolute;
  width:340px;
  height:340px;
  border-radius:50%;
  pointer-events:none;
  background:radial-gradient(circle,rgba(255,240,180,.24) 0%,rgba(255,240,180,.08) 35%,transparent 68%);
  transform:translate(-50%,-50%);
  mix-blend-mode:screen;
  z-index:3
}
@keyframes flicker{
  0%,100%{
    opacity:1
  }
  8%{
    opacity:.25
  }
  10%{
    opacity:1
  }
  24%{
    opacity:.55
  }
  26%{
    opacity:1
  }
  58%{
    opacity:.35
  }
  60%{
    opacity:1
  }
}
.flicker{
  animation:flicker 3.4s linear infinite
}
@keyframes floaty{
  0%,100%{
    transform:translateY(0)
  }
  50%{
    transform:translateY(-10px)
  }
}
.floaty{
  animation:floaty 4s ease-in-out infinite
}
@keyframes spinSlow{
  to{
    transform:rotate(360deg)
  }
}
@keyframes spinRev{
  to{
    transform:rotate(-360deg)
  }
}
.spin-slow{
  animation:spinSlow 9s linear infinite
}
.spin-rev{
  animation:spinRev 14s linear infinite
}
.spin-slower{
  animation:spinSlow 22s linear infinite
}
@keyframes shakeHard{
  0%,100%{
    transform:translate(0,0)
  }
  20%{
    transform:translate(-8px,4px)
  }
  40%{
    transform:translate(7px,-5px)
  }
  60%{
    transform:translate(-6px,-2px)
  }
  80%{
    transform:translate(5px,3px)
  }
}
.shake{
  animation:shakeHard .45s ease
}
@keyframes heartBeat{
  0%,100%{
    transform:scale(1);
    opacity:.25
  }
  50%{
    transform:scale(1.25);
    opacity:.75
  }
}
.heartbeat{
  animation:heartBeat 1s ease-in-out infinite
}
@keyframes riseIn{
  from{
    opacity:0;
    transform:translateY(16px)
  }
  to{
    opacity:1;
    transform:translateY(0)
  }
}
.rise{
  animation:riseIn .5s ease both
}
@keyframes vineIn{
  from{
    transform:translateX(-100%)
  }
  to{
    transform:translateX(0)
  }
}
@keyframes vineInR{
  from{
    transform:translateX(100%)
  }
  to{
    transform:translateX(0)
  }
}
@keyframes flipBrief{
  0%{
    transform:rotate(0)
  }
  35%{
    transform:rotate(180deg)
  }
  70%{
    transform:rotate(180deg)
  }
  100%{
    transform:rotate(360deg)
  }
}
.flip-brief{
  animation:flipBrief 2.4s ease-in-out both
}
@keyframes wipe{
  from{
    transform:translateX(-100%)
  }
  to{
    transform:translateX(100%)
  }
}
.wipe{
  animation:wipe 2.4s ease-in-out both
}
@keyframes portalZoom{
  0%{
    transform:scale(.25);
    opacity:.4
  }
  45%{
    transform:scale(1.3);
    opacity:1
  }
  100%{
    transform:scale(3.2);
    opacity:1
  }
}
.portal-zoom{
  animation:portalZoom 2.4s ease both
}
@keyframes demoPass{
  0%{
    transform:translateX(105vw)
  }
  100%{
    transform:translateX(-30vw)
  }
}
.demo-pass{
  animation:demoPass 11s linear infinite
}
@keyframes tendril{
  0%,100%{
    transform:rotate(-4deg)
  }
  50%{
    transform:rotate(5deg)
  }
}
.tendril{
  transform-origin:top center;
  animation:tendril 3.4s ease-in-out infinite
}
@keyframes bulbPulse{
  0%,100%{
    filter:brightness(1)
  }
  50%{
    filter:brightness(1.8)
  }
}
.bulb-pulse{
  animation:bulbPulse 1s ease-in-out infinite
}
@keyframes staticShift{
  0%{
    background-position:0 0
  }
  100%{
    background-position:120px 80px
  }
}
.static-noise{
  background-image:repeating-linear-gradient(0deg,rgba(255,255,255,.13) 0 1px,transparent 1px 3px);
  animation:staticShift .18s steps(3) infinite
}
@keyframes burst{
  0%{
    transform:translate(0,0) scale(1);
    opacity:1
  }
  100%{
    transform:translate(var(--tx),var(--ty)) scale(.2);
    opacity:0
  }
}
.burst{
  animation:burst 1.1s ease-out both
}
@media (prefers-reduced-motion:reduce){
  .flicker,.floaty,.spin-slow,.spin-rev,.spin-slower,.demo-pass,.tendril,.bulb-pulse{
    animation:none!important
  }
}
.reduce *{
  animation-duration:.01ms!important;
  animation-iteration-count:1!important;
  transition:none!important
}
.hover\:bg-red-500:hover {
  --tw-bg-opacity: 1;
  background-color: rgb(239 68 68 / var(--tw-bg-opacity, 1));
}
.hover\:bg-white\/15:hover {
  background-color: rgb(255 255 255 / 0.15);
}
.disabled\:opacity-40:disabled {
  opacity: 0.4;
}
